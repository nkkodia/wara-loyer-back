management:
  # 1. Définit le préfixe pour TOUS les endpoints Actuator
  endpoints:
    web:
      base-path: /management # Rend l'accès à /management/prometheus

  # 2. Expose les endpoints souhaités
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    # Activer l'endpoint prometheus (souvent implicite si la dépendance est présente, mais bonne pratique)
    prometheus:
      enabled: true
    # Le paramètre pour l'exposition globale doit être ici (pour toutes les APIs)
    web:
      exposure:
        include: prometheus, health # Incluez explicitement les endpoints

